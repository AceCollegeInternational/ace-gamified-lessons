<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>✖️ Fraction Quest 2 — Multiply Your Way to the Top!</title>
<style>
/* ===== FONTS & RESET ===== */
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --sun:#FFD93D;--sky:#4FC3F7;--grass:#56C596;--coral:#FF6B6B;--purple:#A78BFA;
  --orange:#FF9F43;--pink:#FF6EB4;--dark:#1a1a2e;--white:#fff;
  --teal:#26d0ce;--lime:#b8f400;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:var(--dark);}

/* ===== STARFIELD BACKGROUND ===== */
#bg{position:fixed;inset:0;background:linear-gradient(135deg,#0a0a1a,#1a0533,#0d1f3c);z-index:0;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s infinite alternate;}
@keyframes twinkle{0%{opacity:.2;transform:scale(1);}100%{opacity:1;transform:scale(1.5);}}

/* ===== FLOATING MATH SYMBOLS ===== */
.float-sym{
  position:fixed;font-size:1.6rem;opacity:.06;pointer-events:none;z-index:0;
  animation:floatUp linear infinite;
}
@keyframes floatUp{0%{transform:translateY(110vh) rotate(0deg);opacity:.06;}100%{transform:translateY(-10vh) rotate(360deg);opacity:0;}}

/* ===== APP SHELL ===== */
#app{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}

/* ===== HUD ===== */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;
  background:rgba(10,10,26,.88);backdrop-filter:blur(14px);
  border-bottom:2px solid rgba(255,255,255,.07);
}
.hud-item{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.95rem;color:#fff;}
#xp-bar-wrap{flex:1;max-width:200px;height:14px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:0 12px;}
#xp-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--purple));border-radius:99px;transition:width .6s ease;}
.badge-chip{background:linear-gradient(135deg,var(--teal),var(--purple));padding:3px 10px;border-radius:99px;font-size:.75rem;margin-left:4px;animation:pop .3s ease;}
#sound-btn{cursor:pointer;background:none;border:none;font-size:1.5rem;color:#fff;transition:transform .2s;}
#sound-btn:hover{transform:scale(1.2);}

/* ===== PROGRESS BAR ===== */
#progress-wrap{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:8px 20px;background:rgba(10,10,26,.88);display:flex;align-items:center;gap:12px;}
#prog-label{color:rgba(255,255,255,.65);font-size:.82rem;white-space:nowrap;}
#prog-track{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;}
#prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--coral),var(--orange),var(--sun));border-radius:99px;transition:width .5s ease;}
#prog-pct{color:#fff;font-size:.82rem;font-weight:800;min-width:36px;text-align:right;}

/* ===== SLIDE WRAPPER ===== */
#slide-wrap{
  width:min(900px,96vw);
  max-height:calc(100vh - 112px);
  overflow-y:auto;
  margin-top:62px;
  padding-bottom:62px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;
}
#slide-wrap::-webkit-scrollbar{width:4px;}
#slide-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px;}

/* ===== SLIDE CARD ===== */
/* slideIn: spatial animation triggers attention, priming the brain for new content */
.slide{
  background:rgba(255,255,255,.055);backdrop-filter:blur(18px);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:28px;padding:30px 36px;
  animation:slideIn .45s cubic-bezier(.34,1.56,.64,1);
  min-height:340px;display:flex;flex-direction:column;gap:16px;
}
@keyframes slideIn{from{opacity:0;transform:translateY(44px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.slide h1{font-family:'Fredoka One',cursive;font-size:clamp(1.6rem,3.5vw,2.4rem);color:var(--sun);line-height:1.2;animation:fadeUp .5s .1s both;}
.slide h2{font-family:'Fredoka One',cursive;font-size:clamp(1.2rem,2.5vw,1.8rem);color:var(--sky);animation:fadeUp .5s .15s both;}
.slide p,.slide li{font-size:clamp(.88rem,1.8vw,1.08rem);color:rgba(255,255,255,.92);line-height:1.75;animation:fadeUp .5s .2s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

/* ===== CONCEPT BOX ===== */
.concept-box{
  background:linear-gradient(135deg,rgba(38,208,206,.15),rgba(167,139,250,.15));
  border:1.5px solid rgba(38,208,206,.3);border-radius:18px;padding:20px 24px;
  animation:fadeUp .5s .3s both;
}
.concept-box .big-eq{font-family:'Fredoka One',cursive;font-size:clamp(1.6rem,4vw,2.8rem);color:var(--sun);text-align:center;margin:10px 0;line-height:1.3;}

/* ===== FRACTION DISPLAY ===== */
.fraction-display{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;padding:0 5px;vertical-align:middle;}
.fraction-display .top,.fraction-display .bot{font-family:'Fredoka One',cursive;font-size:clamp(1rem,2.5vw,1.7rem);color:var(--white);}
.fraction-display .line{width:100%;height:3px;background:var(--white);border-radius:2px;margin:3px 0;}
.mixed-num{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}
.whole-num{font-family:'Fredoka One',cursive;font-size:clamp(1.2rem,3vw,2.2rem);color:var(--sun);}

/* multiplication cross symbol */
.x-sym{font-family:'Fredoka One',cursive;font-size:clamp(1.2rem,3vw,2rem);color:var(--coral);padding:0 6px;vertical-align:middle;}
.eq-sym{font-family:'Fredoka One',cursive;font-size:clamp(1.2rem,3vw,2rem);color:var(--grass);padding:0 6px;vertical-align:middle;}

/* ===== GRID VISUAL (area model for fraction × fraction) ===== */
.grid-visual{display:flex;flex-direction:column;align-items:center;gap:8px;}
.grid-svg-wrap svg{border-radius:10px;overflow:hidden;}
.grid-legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.82rem;color:rgba(255,255,255,.75);}
.legend-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0;}

/* ===== STEP BOXES ===== */
.steps{list-style:none;display:flex;flex-direction:column;gap:11px;}
.steps li{
  display:flex;align-items:flex-start;gap:14px;
  background:rgba(255,255,255,.06);border-radius:14px;padding:13px 17px;
  animation:fadeUp .5s calc(.14s * var(--i,1)) both;
  border-left:4px solid var(--teal);
}
.step-num{font-family:'Fredoka One',cursive;font-size:1.3rem;color:var(--sun);min-width:30px;}

/* ===== QUIZ ===== */
.quiz-question{
  font-family:'Fredoka One',cursive;
  font-size:clamp(1.05rem,2.4vw,1.55rem);
  color:#fff;text-align:center;margin-bottom:8px;
  animation:fadeUp .4s both;line-height:1.5;
}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;animation:fadeUp .5s .15s both;}
@media(max-width:520px){.options-grid{grid-template-columns:1fr;}}
.opt-btn{
  font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(.85rem,1.7vw,1rem);
  padding:13px 10px;border-radius:16px;border:2px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);color:#fff;cursor:pointer;
  transition:all .2s;text-align:center;line-height:1.5;
}
.opt-btn:hover:not(:disabled){background:rgba(255,255,255,.18);transform:scale(1.03);}
.opt-btn.correct{background:linear-gradient(135deg,#0db887,#00c9a7)!important;border-color:#0db887!important;animation:pop .3s ease;}
.opt-btn.wrong{background:linear-gradient(135deg,#ff4757,#ee5a24)!important;border-color:#ff4757!important;animation:shake .4s ease;}
.opt-btn:disabled{cursor:default;}

/* ===== FEEDBACK ===== */
#feedback{border-radius:16px;padding:13px 18px;text-align:center;font-weight:800;font-size:.95rem;display:none;animation:pop .3s ease;}
#feedback.show{display:block;}
#feedback.correct-fb{background:linear-gradient(135deg,rgba(13,184,135,.22),rgba(0,201,167,.08));border:1.5px solid #0db887;color:#7fffd4;}
#feedback.wrong-fb{background:linear-gradient(135deg,rgba(255,71,87,.22),rgba(238,90,36,.08));border:1.5px solid #ff4757;color:#ffa9ae;}

/* ===== TRUE/FALSE ===== */
.tf-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.tf-btn{font-family:'Fredoka One',cursive;font-size:1.3rem;padding:15px 38px;border-radius:18px;border:none;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(0,0,0,.3);}
.tf-btn.true-btn{background:linear-gradient(135deg,#0db887,#00c9a7);color:#fff;}
.tf-btn.false-btn{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;}
.tf-btn:hover:not(:disabled){transform:scale(1.07) rotate(-1deg);}
.tf-btn:disabled{opacity:.6;cursor:default;}

/* ===== HINT ===== */
.hint-wrap{text-align:center;}
.hint-btn{background:linear-gradient(135deg,var(--orange),var(--sun));color:var(--dark);font-weight:800;padding:8px 20px;border-radius:99px;border:none;cursor:pointer;font-size:.88rem;transition:transform .2s;}
.hint-btn:hover{transform:scale(1.05);}
.hint-text{display:none;background:rgba(255,165,0,.1);border:1px solid var(--orange);border-radius:12px;padding:11px 15px;margin-top:8px;color:rgba(255,255,255,.9);font-size:.88rem;line-height:1.65;animation:fadeUp .3s both;}
.hint-text.show{display:block;}

/* ===== NAV ===== */
#nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;}
.nav-btn{font-family:'Fredoka One',cursive;font-size:1.1rem;padding:12px 28px;border-radius:99px;border:none;cursor:pointer;transition:all .2s;}
#prev-btn{background:rgba(255,255,255,.1);color:rgba(255,255,255,.65);}
#prev-btn:hover{background:rgba(255,255,255,.2);}
#next-btn{background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;box-shadow:0 4px 18px rgba(38,208,206,.38);animation:pulse 2s infinite;}
#next-btn:hover{transform:scale(1.06);animation:none;}
@keyframes pulse{0%,100%{box-shadow:0 4px 18px rgba(38,208,206,.38);}50%{box-shadow:0 4px 28px rgba(38,208,206,.7);}}
@keyframes pop{0%{transform:scale(.8);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

/* ===== STREAK TOAST ===== */
#streak-toast{
  position:fixed;top:72px;right:20px;z-index:200;
  background:linear-gradient(135deg,var(--orange),var(--sun));
  color:var(--dark);font-family:'Fredoka One',cursive;font-size:1.05rem;
  padding:10px 20px;border-radius:99px;
  transform:translateX(220%);transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 4px 20px rgba(255,159,67,.5);
}
#streak-toast.show{transform:translateX(0);}

/* ===== CONFETTI ===== */
.confetti-piece{
  position:fixed;width:10px;height:10px;border-radius:2px;z-index:300;
  animation:confettiFall 2.5s ease-out forwards;pointer-events:none;
}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* ===== BADGE MODAL ===== */
#badge-modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);animation:fadeIn .3s both;}
#badge-modal.show{display:flex;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.badge-popup{background:linear-gradient(135deg,#0d0d2b,#1e0a3c);border:2px solid var(--teal);border-radius:28px;padding:34px 38px;text-align:center;max-width:360px;animation:pop .4s ease;box-shadow:0 0 60px rgba(38,208,206,.35);}
.badge-popup .badge-icon{font-size:4rem;animation:spin 1s ease;display:block;margin:0 auto 12px;}
@keyframes spin{from{transform:rotate(-15deg) scale(0);}to{transform:rotate(0deg) scale(1);}}
.badge-popup h3{font-family:'Fredoka One',cursive;font-size:1.55rem;color:var(--sun);margin-bottom:6px;}
.badge-popup p{color:rgba(255,255,255,.8);font-size:.93rem;}
#badge-ok{margin-top:20px;background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;border:none;padding:12px 30px;border-radius:99px;font-family:'Fredoka One',cursive;font-size:1.05rem;cursor:pointer;transition:transform .2s;}
#badge-ok:hover{transform:scale(1.06);}

/* ===== FINAL SCORE ===== */
.score-big{font-family:'Fredoka One',cursive;font-size:clamp(3rem,8vw,5rem);color:var(--sun);text-align:center;animation:pop .5s both;}
.score-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.score-item{background:rgba(255,255,255,.07);border-radius:14px;padding:13px;text-align:center;}
.score-item .val{font-family:'Fredoka One',cursive;font-size:1.7rem;color:var(--sky);}
.score-item .lbl{font-size:.8rem;color:rgba(255,255,255,.55);margin-top:3px;}
.badges-earned{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;}
.earned-badge{background:linear-gradient(135deg,var(--teal),var(--purple));border-radius:99px;padding:6px 16px;font-size:.86rem;color:#fff;font-weight:800;}

/* ===== FINAL CHALLENGE BAR ===== */
#fc-bar{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
#fc-progress{font-family:'Fredoka One',cursive;font-size:1.05rem;color:var(--sky);}
#fc-score{font-family:'Fredoka One',cursive;font-size:1.05rem;color:var(--sun);}

/* ===== AREA MODEL GRID ===== */
.area-grid{display:inline-grid;border:2px solid rgba(255,255,255,.25);border-radius:8px;overflow:hidden;}
.area-cell{width:40px;height:40px;border:1px solid rgba(255,255,255,.15);transition:background .3s;}

/* ===== COLOR HELPERS ===== */
.c-sun{color:var(--sun);}.c-sky{color:var(--sky);}.c-grass{color:var(--grass);}
.c-coral{color:var(--coral);}.c-teal{color:var(--teal);}.c-orange{color:var(--orange);}
.text-center{text-align:center;}
.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mt-16{margin-top:16px;}
.emoji-big{font-size:2.4rem;display:block;text-align:center;margin:6px 0;}

/* ===== WORD PROBLEM BOX ===== */
.word-box{
  background:linear-gradient(135deg,rgba(255,107,107,.12),rgba(255,159,67,.12));
  border:1.5px solid rgba(255,159,67,.35);border-radius:16px;padding:16px 20px;
  font-style:italic;font-size:clamp(.9rem,1.8vw,1.05rem);line-height:1.75;
}
</style>
</head>
<body>
<div id="bg"></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-item">⭐ <span id="points-display">0</span> pts</div>
  <div class="hud-item">🔥 <span id="streak-display">0</span></div>
  <div id="xp-bar-wrap"><div id="xp-bar"></div></div>
  <div class="hud-item" id="level-display">Lv 1 🌱</div>
  <div class="hud-item" id="badges-hud"></div>
  <button id="sound-btn" title="Toggle sound">🔊</button>
</div>

<!-- STREAK TOAST -->
<div id="streak-toast">🔥 STREAK x<span id="streak-count">0</span>! +<span id="streak-bonus">0</span> BONUS!</div>

<!-- MAIN SLIDE -->
<div id="app">
  <div id="slide-wrap">
    <div id="slide-content"></div>
    <div id="nav">
      <button class="nav-btn" id="prev-btn">← Back</button>
      <button class="nav-btn" id="next-btn">Next →</button>
    </div>
  </div>
</div>

<!-- BOTTOM PROGRESS -->
<div id="progress-wrap">
  <span id="prog-label">Slide 1</span>
  <div id="prog-track"><div id="prog-fill"></div></div>
  <span id="prog-pct">0%</span>
</div>

<!-- BADGE MODAL -->
<div id="badge-modal">
  <div class="badge-popup">
    <span class="badge-icon" id="badge-icon">🏆</span>
    <h3 id="badge-title">Badge Unlocked!</h3>
    <p id="badge-desc">You earned a new badge!</p>
    <button id="badge-ok">Awesome! 🎉</button>
  </div>
</div>

<!-- AUDIO (replace file paths with real .mp3s) -->
<audio id="audio-correct" src="correct.mp3" preload="none"></audio>
<audio id="audio-wrong"   src="wrong.mp3"   preload="none"></audio>
<audio id="audio-levelup" src="levelup.mp3"  preload="none"></audio>
<audio id="audio-bg"      src="bgmusic.mp3"  loop preload="none"></audio>

<script>
/*
  =====================================================
  FRACTION QUEST 2 — MULTIPLYING FRACTIONS
  Grade 4 | Baltimore, Maryland
  Skill Progression:
    Level 1 → Fraction × whole number
    Level 2 → Fraction × fraction (proper)
    Level 3 → Simplifying before or after multiplying
    Level 4 → Mixed number × whole number
    Level 5 → Mixed number × fraction        (PEAK)
    Level 6 → Mixed number × mixed number    (PEAK)
  =====================================================
*/

// ========== STATE ==========
const state = {
  currentSlide:0, points:0, streak:0, maxStreak:0,
  badges:[], soundOn:false, quizAnswered:false, xp:0, level:1
};

// ========== AUDIO ==========
function playSound(id){
  if(!state.soundOn) return;
  const el=document.getElementById('audio-'+id);
  if(el){el.currentTime=0;el.play().catch(()=>{});}
}

// ========== POINTS / XP / LEVEL ==========
function addPoints(p){
  state.points+=p; state.xp+=p;
  document.getElementById('points-display').textContent=state.points;
  const xpPL=200;
  const lvl=Math.floor(state.xp/xpPL)+1;
  if(lvl>state.level){state.level=lvl;onLevelUp();}
  const pct=((state.xp%xpPL)/xpPL)*100;
  document.getElementById('xp-bar').style.width=pct+'%';
  const icons=['🌱','🌿','⭐','🚀','💎','👑','🔮'];
  document.getElementById('level-display').textContent=`Lv ${state.level} ${icons[Math.min(state.level-1,icons.length-1)]}`;
}
function onLevelUp(){
  playSound('levelup'); launchConfetti(55);
  showBadgeModal({icon:'🚀',title:`Level ${state.level} Reached!`,desc:'You are multiplying fractions like a pro! Keep it up!'});
}

// ========== STREAK ==========
function updateStreak(correct){
  if(correct){
    state.streak++;
    if(state.streak>state.maxStreak) state.maxStreak=state.streak;
    document.getElementById('streak-display').textContent=state.streak;
    if(state.streak>=3){const bonus=state.streak*5;addPoints(bonus);showStreakToast(state.streak,bonus);}
    checkBadges();
  } else {
    state.streak=0;
    document.getElementById('streak-display').textContent='0';
  }
}
function showStreakToast(s,bonus){
  const t=document.getElementById('streak-toast');
  document.getElementById('streak-count').textContent=s;
  document.getElementById('streak-bonus').textContent=bonus;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200);
}

// ========== BADGES ==========
const BADGES=[
  {id:'first_correct', icon:'⭐', title:'First Multiply!',   desc:'Got your first multiplication correct!', condition:()=>state.points>=10},
  {id:'streak3',       icon:'🔥', title:'Multiplying Streak!',desc:'3 correct answers in a row!',           condition:()=>state.streak>=3},
  {id:'cross_cancel',  icon:'✂️', title:'Cross-Canceller!',  desc:'You mastered simplifying before multiplying!', condition:()=>state.points>=80},
  {id:'mixed_hero',    icon:'🦸', title:'Mixed Number Hero!', desc:'You can multiply mixed numbers!',        condition:()=>false},
  {id:'fast_multiplier',icon:'⚡','title':'Speed Multiplier!',desc:'10 questions answered correctly!',       condition:()=>state.points>=100},
  {id:'level2',        icon:'🌟', title:'Star Student!',      desc:'Reached Level 2!',                       condition:()=>state.level>=2},
  {id:'fraction_champ',icon:'🏆', title:'Fraction Champion!', desc:'Scored 80%+ on the Final Challenge!',   condition:()=>false},
];
function checkBadges(){
  BADGES.forEach(b=>{
    if(!state.badges.includes(b.id)&&b.condition()){
      state.badges.push(b.id); showBadgeModal(b); renderBadgesHUD();
    }
  });
}
function renderBadgesHUD(){
  document.getElementById('badges-hud').innerHTML=state.badges.slice(-3).map(id=>{
    const b=BADGES.find(x=>x.id===id); return b?`<span class="badge-chip">${b.icon}</span>`:'';
  }).join('');
}

// ========== BADGE MODAL ==========
function showBadgeModal(b){
  document.getElementById('badge-icon').textContent=b.icon||'🏆';
  document.getElementById('badge-title').textContent=b.title;
  document.getElementById('badge-desc').textContent=b.desc;
  document.getElementById('badge-modal').classList.add('show');
}
document.getElementById('badge-ok').onclick=()=>document.getElementById('badge-modal').classList.remove('show');

// ========== CONFETTI ==========
function launchConfetti(n=40){
  const cols=['#FFD93D','#FF6B6B','#4FC3F7','#A78BFA','#56C596','#FF9F43','#FF6EB4','#26d0ce'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div'); el.className='confetti-piece';

// ========== FRACTION HELPERS ==========
function frac(top,bot){
  return `<span class="fraction-display"><span class="top">${top}</span><span class="line"></span><span class="bot">${bot}</span></span>`;
}
function mixed(w,top,bot){
  return `<span class="mixed-num"><span class="whole-num">${w}</span>${frac(top,bot)}</span>`;
}
function xSym(){ return `<span class="x-sym">×</span>`; }
function eqSym(){ return `<span class="eq-sym">=</span>`; }

// ========== AREA MODEL SVG ==========
/* Rectangular area model visually shows why fraction × fraction works
   — activates spatial reasoning alongside numerical reasoning */
function areaModelSVG(n1,d1,n2,d2,size=200){
  const cw=size/d2, ch=size/d1;
  let rects=''; let cells='';
  // full grid
  for(let r=0;r<d1;r++){
    for(let c=0;c<d2;c++){
      const shaded=(r<n1&&c<n2);
      cells+=`<rect x="${c*cw}" y="${r*ch}" width="${cw}" height="${ch}"
        fill="${shaded?'rgba(255,107,107,0.65)':'rgba(79,195,247,0.12)'}"
        stroke="rgba(255,255,255,0.2)" stroke-width="1"/>`;
    }
  }
  // row & col labels
  let rowLabels='',colLabels='';
  for(let r=0;r<d1;r++) rowLabels+=`<text x="-6" y="${r*ch+ch/2+5}" font-size="11" fill="rgba(255,255,255,.55)" text-anchor="end">${r+1}</text>`;
  for(let c=0;c<d2;c++) colLabels+=`<text x="${c*cw+cw/2}" y="-5" font-size="11" fill="rgba(255,255,255,.55)" text-anchor="middle">${c+1}</text>`;

  return `<svg width="${size+30}" height="${size+30}" viewBox="-22 -18 ${size+30} ${size+30}">
    ${cells}
    <rect x="0" y="0" width="${n2*cw}" height="${n1*ch}" fill="none" stroke="rgba(255,107,107,.8)" stroke-width="2.5" rx="3"/>
    ${rowLabels}${colLabels}
    <text x="${size/2}" y="${size+22}" font-size="12" fill="rgba(255,255,255,.5)" text-anchor="middle">← ${d2} columns (denominator 2) →</text>
    <text x="-18" y="${size/2}" font-size="11" fill="rgba(255,255,255,.5)" text-anchor="middle" transform="rotate(-90,-18,${size/2})">← ${d1} rows →</text>
  </svg>`;
}

// ========== PIE FRACTION SVG ==========
function pieSVG(num,den,size=80){
  if(den===0||num===0) return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${size*0.44}" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.2)" stroke-width="2"/></svg>`;
  const cx=size/2,cy=size/2,r=size*0.44;
  const step=(2*Math.PI)/den; let slices='';
  const cs=['#FF6B6B','#FF9F43','#FFD93D','#56C596','#4FC3F7','#A78BFA','#FF6EB4'];
  for(let i=0;i<den;i++){
    const a1=-Math.PI/2+i*step, a2=a1+step;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const lg=step>Math.PI?1:0;
    slices+=`<path d="M${cx},${cy}L${x1},${y1}A${r},${r},0,${lg},1,${x2},${y2}Z" fill="${i<num?cs[i%cs.length]:'rgba(255,255,255,.07)'}" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>`;
  }
  return `<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#0d0d2b" stroke="rgba(255,255,255,.1)" stroke-width="2"/>${slices}<circle cx="${cx}" cy="${cy}" r="4" fill="rgba(255,255,255,.35)"/></svg>`;
}

      <li>✅ <strong>Level 1</strong> — Fraction × Whole Number</li>

// ===================================================
//  R E N D E R   E N G I N E
// ===================================================
function renderSlide(){
  const slide=slides[state.currentSlide];
  state.quizAnswered=false;
  let html='<div class="slide">';
  if(slide.type==='info')         html+=slide.render();
  else if(slide.type==='quiz')    html+=renderQuiz(slide);
  else if(slide.type==='trueFalse') html+=renderTF(slide);
  else if(slide.type==='fc')      html+=renderFC(slide, state.currentSlide-FC_START);
  else if(slide.type==='celebration') html+=renderCelebration();
  html+='</div>';
  document.getElementById('slide-content').innerHTML=html;
  updateProgress();
  document.getElementById('slide-wrap').scrollTop=0;

  if(slide.type==='celebration'){ setTimeout(()=>launchConfetti(90),300); checkFractionChampBadge(); }
  if(state.currentSlide===23) setTimeout(checkMixedHeroBadge, 800); // Level 6 peak skill reached
  if(slide.type==='quiz')    bindQuizEvents(slide);
  if(slide.type==='trueFalse') bindTFEvents(slide);
  if(slide.type==='fc')      bindFCEvents(slide, state.currentSlide-FC_START);

  document.getElementById('prev-btn').style.visibility=state.currentSlide===0?'hidden':'visible';
  document.getElementById('next-btn').textContent=state.currentSlide===slides.length-1?'🎉 Finish':'Next →';
}

function updateProgress(){
  const total=slides.length, cur=state.currentSlide+1;
  const pct=Math.round((cur/total)*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-label').textContent=`Slide ${cur} of ${total}`;
}

// ── Quiz renderer
function renderQuiz(slide){
  return `
    <p class="quiz-question">${slide.question}</p>
    <div class="options-grid">
      ${slide.options.map((o,i)=>`<button class="opt-btn" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="hint-wrap mt-8">
      <button class="hint-btn" onclick="toggleHint(this)">💡 Show Hint</button>
      <div class="hint-text">${slide.hint}</div>
    </div>
    <div id="feedback"></div>`;
}
function bindQuizEvents(slide){
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(state.quizAnswered) return; state.quizAnswered=true;
      const i=parseInt(btn.dataset.i), correct=i===slide.correct;
      btn.classList.add(correct?'correct':'wrong');
      if(!correct) document.querySelectorAll('.opt-btn')[slide.correct].classList.add('correct');
      document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      showFeedback(correct,slide.explanation);
      if(correct){addPoints(10);playSound('correct');}else playSound('wrong');
      updateStreak(correct); checkBadges();
    });
  });
}

// ── True/False renderer
function renderTF(slide){
  return `
    <p class="quiz-question">${slide.question}</p>
    <div class="tf-row">
      <button class="tf-btn true-btn" data-v="true">✅ TRUE</button>
      <button class="tf-btn false-btn" data-v="false">❌ FALSE</button>
    </div>
    <div id="feedback"></div>`;
}
function bindTFEvents(slide){
  document.querySelectorAll('.tf-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(state.quizAnswered) return; state.quizAnswered=true;
      const val=btn.dataset.v==='true', correct=val===slide.correct;
      btn.style.outline=correct?'3px solid #7fffd4':'3px solid #ffa9ae';
      if(!correct) btn.style.opacity='.4';
      document.querySelectorAll('.tf-btn').forEach(b=>b.disabled=true);
      showFeedback(correct,slide.explanation);
      if(correct){addPoints(10);playSound('correct');}else playSound('wrong');
      updateStreak(correct); checkBadges();
    });
  });
}

// ── Final Challenge renderer
function renderFC(slide,idx){
  if(idx<0||idx>=FC_TOTAL) return '<p>Error</p>';
  const q=fcState.answered[idx]; const answered=q!==null;
  return `
    <div id="fc-bar">
      <span id="fc-progress">Question ${idx+1} / ${FC_TOTAL}</span>
      <span id="fc-score">✅ ${fcState.correct} correct</span>
    </div>
    <p class="quiz-question" style="margin-top:14px;">${slide.q}</p>
    <div class="options-grid">
      ${slide.opts.map((o,i)=>`<button class="opt-btn ${answered?(i===slide.ans?'correct':(i===q?'wrong':'')):''}
        " data-i="${i}" ${answered?'disabled':''}>${o}</button>`).join('')}
    </div>
    <div id="feedback" class="${answered?(q===slide.ans?'show correct-fb':'show wrong-fb'):''}">
      ${answered?(q===slide.ans?'✅ Correct! +15 points!':`❌ The answer was: ${slide.opts[slide.ans]}`):''}
    </div>`;
}
function bindFCEvents(slide,idx){
  if(idx<0||idx>=FC_TOTAL) return;
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(fcState.answered[idx]!==null) return;
      const i=parseInt(btn.dataset.i), correct=i===slide.ans;
      fcState.answered[idx]=i;
      if(correct){fcState.correct++;addPoints(15);playSound('correct');}else playSound('wrong');
      updateStreak(correct); checkBadges();
      document.getElementById('slide-content').innerHTML='<div class="slide">'+renderFC(slide,idx)+'</div>';
      bindFCEvents(slide,idx);
    });
  });
}

// ── Celebration renderer
function renderCelebration(){
  const total=FC_TOTAL, correct=fcState.correct;
  const pct=Math.round((correct/total)*100);
  const grade=pct>=90?'🌟 Outstanding!':pct>=80?'🎉 Excellent!':pct>=70?'👍 Great Job!':pct>=60?'💪 Keep Going!':'🔄 Try Again!';
  const earnedBadges=state.badges.map(id=>{
    const b=BADGES.find(x=>x.id===id); return b?`<div class="earned-badge">${b.icon} ${b.title}</div>`:'';
  }).join('');
  return `
    <h1 class="text-center">🎉 Multiplication Quest Complete!</h1>
    <div class="text-center" style="font-size:2.8rem;">${grade}</div>
    <div class="score-big">${pct}%</div>
    <div class="score-breakdown">
      <div class="score-item"><div class="val">${correct}/${total}</div><div class="lbl">Final Challenge</div></div>
      <div class="score-item"><div class="val">${state.points}</div><div class="lbl">Total Points ⭐</div></div>
      <div class="score-item"><div class="val">${state.maxStreak}</div><div class="lbl">Best Streak 🔥</div></div>
      <div class="score-item"><div class="val">Lv ${state.level}</div><div class="lbl">Level Reached 🚀</div></div>
    </div>
    ${earnedBadges?`<div class="badges-earned">${earnedBadges}</div>`:''}
    <div class="concept-box mt-12 text-center">
      <p style="font-weight:800;color:var(--sun);">Today you mastered:</p>
      <p class="mt-8">✅ Fraction × Whole &nbsp; ✅ Fraction × Fraction<br>
         ✅ Cross-cancelling &nbsp; ✅ Mixed × Whole<br>
         ✅ Mixed × Fraction &nbsp; ✅ Mixed × Mixed 👑</p>
    </div>
    <div class="text-center mt-12">
      <button onclick="restartLesson()" style="background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;border:none;padding:14px 32px;border-radius:99px;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;">🔄 Play Again!</button>
    </div>`;
}

// ── Feedback
function showFeedback(correct,explanation){
  const fb=document.getElementById('feedback');
  fb.className='show '+(correct?'correct-fb':'wrong-fb');
  fb.innerHTML=correct
    ?`✅ <strong>Correct!</strong> +10 points! ${explanation}`
    :`❌ <strong>Not quite.</strong> ${explanation}`;
}

// ── Hint
function toggleHint(btn){
  const ht=btn.nextElementSibling; ht.classList.toggle('show');
  btn.textContent=ht.classList.contains('show')?'🙈 Hide Hint':'💡 Show Hint';
}

// ── Nav
document.getElementById('next-btn').addEventListener('click',()=>{
  if(state.currentSlide<slides.length-1){
    state.currentSlide++;
    renderSlide();
    // Confetti bursts on section completions
    const i=state.currentSlide;
    if(i===6||i===10||i===15||i===23||i===27) launchConfetti(35);
  }
});
document.getElementById('prev-btn').addEventListener('click',()=>{
  if(state.currentSlide>0){state.currentSlide--;renderSlide();}
});

// ── Mixed Hero badge (awarded when entering peak level slides)
function checkMixedHeroBadge(){
  if(!state.badges.includes('mixed_hero')){
    state.badges.push('mixed_hero'); renderBadgesHUD();
    showBadgeModal({icon:'🦸',title:'Mixed Number Hero!',desc:'You tackled Mixed Number multiplication — incredible!'});
  }
}

// ── Fraction Champion badge
function checkFractionChampBadge(){
  const pct=Math.round((fcState.correct/FC_TOTAL)*100);
  if(pct>=80&&!state.badges.includes('fraction_champ')){
    state.badges.push('fraction_champ'); renderBadgesHUD();
    setTimeout(()=>{
      showBadgeModal({icon:'🏆',title:'Fraction Champion!',desc:`You scored ${pct}% on the Final Challenge! You're a Multiplication Master!`});
    },1500);
  }
}

// ── Keyboard navigation
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') document.getElementById('next-btn').click();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') document.getElementById('prev-btn').click();
});

// ── Sound toggle
document.getElementById('sound-btn').addEventListener('click',()=>{
  state.soundOn=!state.soundOn;
  document.getElementById('sound-btn').textContent=state.soundOn?'🔊':'🔇';
  if(state.soundOn) document.getElementById('audio-bg').play().catch(()=>{});
  else document.getElementById('audio-bg').pause();
});

// ── Restart
function restartLesson(){
  state.currentSlide=0;state.points=0;state.streak=0;state.maxStreak=0;
  state.badges=[];state.xp=0;state.level=1;
  fcState.correct=0;fcState.answered.fill(null);
  document.getElementById('points-display').textContent='0';
  document.getElementById('streak-display').textContent='0';
  document.getElementById('xp-bar').style.width='0%';
  document.getElementById('level-display').textContent='Lv 1 🌱';
  document.getElementById('badges-hud').innerHTML='';
  renderSlide();
}

// ── Floating math symbols (decorative)
function makeFloatingSymbols(){
  const syms=['×','÷','½','¾','⅓','⅔','%','='];
  const bg=document.getElementById('bg');
  for(let i=0;i<18;i++){
    const el=document.createElement('div'); el.className='float-sym';
    el.textContent=syms[Math.floor(Math.random()*syms.length)];
    el.style.cssText=`left:${Math.random()*100}vw;animation-duration:${18+Math.random()*14}s;animation-delay:${Math.random()*12}s;font-size:${1.2+Math.random()*1.4}rem;`;
    bg.appendChild(el);
  }
}

// ── Starfield
function makeStars(){
  const bg=document.getElementById('bg');
  for(let i=0;i<130;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=1+Math.random()*2.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s;`;
    bg.appendChild(s);
  }
}

// ── Shuffle answer positions
/* Randomizes option order ONCE at load so the correct answer isn't always first.
   Runs before any render, so Final-Challenge re-renders stay consistent.
   True/False slides are left untouched (their buttons are fixed). */
function shuffleAllSlides(){
  slides.forEach(slide=>{
    if(slide.type==='quiz'){
      const correctVal = slide.options[slide.correct];
      shuffleArray(slide.options);
      slide.correct = slide.options.indexOf(correctVal);
    } else if(slide.type==='fc'){
      const correctVal = slide.opts[slide.ans];
      shuffleArray(slide.opts);
      slide.ans = slide.opts.indexOf(correctVal);
    }
  });
}
function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

// ── INIT
shuffleAllSlides();
makeStars();
makeFloatingSymbols();
renderSlide();
</script>
