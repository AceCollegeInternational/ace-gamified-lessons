  <style>
    :root {
      --bg1: #4b2bd6;

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Comic Sans MS", "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    .app {
      min-height: 100vh;
      width: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 12px 18px;
      gap: 10px;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .bubble {
      background: rgba(255,255,255,.95);
      border-radius: 20px;
      padding: 10px 14px;
      font-weight: bold;
      border: 3px solid #fff;
      box-shadow: 0 8px 18px rgba(0,0,0,.16);
      text-align: center;
    }

    .progress-wrap {
      background: #ffffffcc;
      border-radius: 999px;
      height: 24px;
      overflow: hidden;
      border: 2px solid #fff;
      box-shadow: inset 0 0 8px rgba(0,0,0,.12);
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffbe0b, #fb5607);
      transition: width .5s ease;
    }

    .stage {
      background: #ffffffea;
      border-radius: 24px;
      border: 4px solid #fff;
      padding: 18px;
      box-shadow: 0 18px 30px rgba(0,0,0,.2);
      overflow: auto;
      position: relative;
    }

    .slide { display: none; height: 100%; }
    .slide.active { display: block; }

    h1, h2 { margin: 4px 0 10px; }
    .subtitle { font-size: 1.1rem; margin: 0 0 10px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .card {
      background: #fff;
      border: 3px dashed #c77dff;
      border-radius: 18px;
      padding: 12px;
      animation: slideIn .6s ease;
    }

    .clip {
      width: min(100%, 560px);
      display: block;
      margin: 8px auto;
      border-radius: 14px;
      border: 3px solid #fff;
      box-shadow: 0 8px 18px rgba(0,0,0,.15);
    }

    .choices { display: grid; gap: 8px; }

    button {
      border: none;
      border-radius: 16px;
      padding: 10px 12px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    button:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 8px 16px rgba(0,0,0,.16); }

    .choice { background: #edf2ff; border: 2px solid #b8c0ff; }
    .choice.correct { background: #d8f3dc; border-color: var(--good); }
    .choice.wrong { background: #ffe3e3; border-color: var(--bad); animation: shake .35s; }

    .nav { display: flex; justify-content: space-between; gap: 10px; }
    .nav button { flex: 1; }
    .btn-back { background: #bde0fe; }
    .btn-next { background: #ffcf56; animation: pulse 1.5s infinite; }

    .feedback { min-height: 24px; font-weight: bold; margin-top: 8px; }
    .good { color: #087f23; }
    .bad { color: #b00020; }

    .hint { background: #f1f3f5; border-left: 5px solid #f8961e; padding: 8px; border-radius: 8px; display: none; }
    .show { display: block; }

    .badge { display: inline-block; background: #ffd60a; padding: 5px 10px; border-radius: 999px; margin: 4px; }

    .dropzone {
      padding: 12px;
      border: 3px dashed #888;
      border-radius: 12px;
      min-height: 50px;
      margin-bottom: 10px;
      background: #fff;
    }

    .token {
      display: inline-block;
      margin: 4px;
      padding: 8px 10px;
      background: #e0fbfc;
      border-radius: 999px;
      border: 2px solid #98c1d9;
      cursor: pointer;
    }

    #confetti { position: fixed; inset: 0; pointer-events: none; }

    /* Fade helps focus attention on one chunk at a time (chunking principle). */
    .fade-in { animation: fadeIn .7s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity:1; transform:none;} }

    /* Slide-in supports curiosity by revealing ideas as a sequence. */
    @keyframes slideIn { from { opacity:0; transform: translateX(30px);} to { opacity:1; transform:none;} }

    /* Pulse on Next button nudges active recall actions without distracting audio/visual load. */
    @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.04);} }

    /* Shake gives immediate error feedback and supports fast correction loops. */
    @keyframes shake {
      0%,100% { transform: translateX(0);}
      20% { transform: translateX(-5px);} 40% { transform: translateX(5px);} 60% { transform: translateX(-4px);} 80% { transform: translateX(4px);} }

    .small { font-size: .95rem; }
  </style>
